name: One-shot X2D external slot fix
# Retriggered after live X2D duplicate-slot audit.

on:
  push:
    branches: [fix/x2d-external-slot-canonical-1.3.9]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.ref_name == 'fix/x2d-external-slot-canonical-1.3.9' || github.head_ref == 'fix/x2d-external-slot-canonical-1.3.9'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply product patch and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          driver = Path('bambuddy/driver.py')
          text = driver.read_text(encoding='utf-8')

          old = 'snap[f"255-{vt_id}"] = self._tray_snapshot(vt)'
          new = 'snap[external_slot_index(vt_id)] = self._tray_snapshot(vt)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one legacy pending-snapshot key, found {count}')
          text = text.replace(old, new, 1)

          def add_locale(label: str, ru: str, uk: str) -> None:
              global text
              pattern = rf'(?P<indent>\s*)"label": "{re.escape(label)}",'
              matches = list(re.finditer(pattern, text))
              if len(matches) != 1:
                  raise SystemExit(f'expected one action label {label!r}, found {len(matches)}')
              m = matches[0]
              indent = m.group('indent')
              replacement = (
                  f'{indent}"label": "{label}",'
                  f'{indent}"labelByLocale": {{"ru": "{ru}", "uk": "{uk}"}},'
              )
              text = text[:m.start()] + ''.join(replacement) + text[m.end():]

          add_locale('Sync Now', 'Синхронизировать', 'Синхронізувати')
          add_locale('Full Resync', 'Полная пересинхронизация', 'Повна повторна синхронізація')
          driver.write_text(text, encoding='utf-8')

          manifest_path = Path('bambuddy/plugin.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '1.3.8':
              raise SystemExit(f"expected plugin 1.3.8, got {manifest.get('version')}")
          manifest['version'] = '1.3.9'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/test_external_slots.py')
          tests = test_path.read_text(encoding='utf-8')
          addition = r'''


def test_pending_snapshot_uses_canonical_external_slot_ids():
    source = Path(__file__).resolve().parents[1].joinpath("bambuddy", "driver.py").read_text(encoding="utf-8")
    start = source.index("def _capture_pending_snapshot")
    tail = source[start:]
    match = re.search(r"\n    (?:async )?def ", tail[1:])
    method = tail if match is None else tail[: match.start() + 1]
    assert "external_slot_index(vt_id)" in method
    assert 'f"255-{vt_id}"' not in method


def test_sync_actions_have_russian_and_ukrainian_labels():
    source = Path(__file__).resolve().parents[1].joinpath("bambuddy", "driver.py").read_text(encoding="utf-8")
    assert '"labelByLocale": {"ru": "Синхронизировать", "uk": "Синхронізувати"}' in source
    assert '"labelByLocale": {"ru": "Полная пересинхронизация", "uk": "Повна повторна синхронізація"}' in source


def test_manifest_version_is_1_3_9():
    manifest = json.loads(Path(__file__).resolve().parents[1].joinpath("bambuddy", "plugin.json").read_text(encoding="utf-8"))
    assert manifest["version"] == "1.3.9"
'''
          if 'test_pending_snapshot_uses_canonical_external_slot_ids' not in tests:
              if 'from pathlib import Path' not in tests:
                  tests = 'from pathlib import Path\nimport json\nimport re\n' + tests
              else:
                  if 'import json' not in tests:
                      tests = tests.replace('from pathlib import Path\n', 'from pathlib import Path\nimport json\n', 1)
                  if 'import re' not in tests:
                      tests = tests.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 1)
              tests += addition
              test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Checkout FilaMan runtime
        uses: actions/checkout@v4
        with:
          repository: MikeFox303/filaman-system
          ref: main
          path: filaman-system

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked FilaMan dependencies
        working-directory: filaman-system/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --extra dev

      - name: Install candidate plugin into FilaMan runtime
        run: |
          mkdir -p filaman-system/backend/app/plugins/bambuddy
          cp -a bambuddy/. filaman-system/backend/app/plugins/bambuddy/

      - name: Run plugin tests
        working-directory: filaman-system/backend
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/bambuddy:${{ github.workspace }}/filaman-system/backend
        run: uv run pytest "$GITHUB_WORKSPACE/tests" -q

      - name: Compile plugin
        run: python -m compileall -q bambuddy

      - name: Commit validated product patch and remove one-shot workflow
        shell: bash
        run: |
          BRANCH='${{ github.head_ref || github.ref_name }}'
          rm .github/workflows/one-shot-x2d-slot-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bambuddy/driver.py bambuddy/plugin.json tests/test_external_slots.py .github/workflows/one-shot-x2d-slot-fix.yml
          git commit -m 'fix: canonicalize X2D external slot snapshots'
          git push origin HEAD:"$BRANCH"
