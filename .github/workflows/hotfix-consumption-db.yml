name: Stage consumption DB hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/consumption-missing-greenlet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply verified hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('bambuddy/driver.py')
          s = p.read_text()
          old = '''    async def _report_consumption(\n        self, filaman_spool_id: int, delta_g: float, *, source_event_key: str | None = None\n    ) -> None:\n        try:\n            await self._report_consumption_db(filaman_spool_id, delta_g, source_event_key=source_event_key)\n        except Exception as e:\n            logger.warning(f"Failed to report consumption for FilaMan spool {filaman_spool_id}: {e}")\n'''
          new = '''    async def _report_consumption(\n        self, filaman_spool_id: int, delta_g: float, *, source_event_key: str | None = None\n    ) -> None:\n        # Consumption is the one write we must not silently lose. Retry with a\n        # fresh AsyncSession while preserving the same source_event_key so a\n        # successful first attempt followed by a transport/task failure cannot\n        # double-debit the spool.\n        last_error: Exception | None = None\n        for attempt in range(1, 4):\n            try:\n                await self._report_consumption_db(\n                    filaman_spool_id, delta_g, source_event_key=source_event_key\n                )\n                return\n            except Exception as e:\n                last_error = e\n                logger.warning(\n                    "Consumption write attempt %d/3 failed for FilaMan spool %s: %s",\n                    attempt,\n                    filaman_spool_id,\n                    e,\n                )\n                if attempt < 3:\n                    await asyncio.sleep(0.25 * attempt)\n        logger.error(\n            "Failed to report consumption for FilaMan spool %s after 3 attempts: %s",\n            filaman_spool_id,\n            last_error,\n        )\n'''
          if old not in s and new not in s:
              raise SystemExit('report_consumption source block not found')
          s = s.replace(old, new)

          old_db = '''        async with async_session_maker() as db:\n            spool = await db.get(Spool, filaman_spool_id)\n            if not spool:\n                logger.warning(\n                    f"FilaMan spool {filaman_spool_id} not found for consumption report"\n                )\n                return\n            service = SpoolService(db)\n            _, remaining = await service.record_consumption(\n'''
          new_db = '''        async with async_session_maker() as db:\n            service = SpoolService(db)\n            # Do not use db.get(Spool) here. record_consumption() may inspect\n            # spool.status for the automatic new→opened transition; an unloaded\n            # relationship would lazy-load from the WebSocket background task and\n            # raises SQLAlchemy MissingGreenlet. SpoolService.get_spool() eagerly\n            # loads the relationships its write methods require.\n            spool = await service.get_spool(filaman_spool_id)\n            if not spool:\n                logger.warning(\n                    f"FilaMan spool {filaman_spool_id} not found for consumption report"\n                )\n                return\n            _, remaining = await service.record_consumption(\n'''
          if old_db not in s and new_db not in s:
              raise SystemExit('report_consumption_db source block not found')
          s = s.replace(old_db, new_db)
          p.write_text(s)

          manifest_path = Path('bambuddy/plugin.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '1.3.10'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          test = Path('tests/test_consumption_protocol.py')
          ts = test.read_text()
          marker = 'test_report_consumption_db_uses_eager_service_loader'
          if marker not in ts:
              ts += '''\n\n@pytest.mark.asyncio\nasync def test_report_consumption_db_uses_eager_service_loader(monkeypatch):\n    """Regression: WebSocket consumption must not lazy-load Spool.status.\n\n    The physical X2D test exposed SQLAlchemy MissingGreenlet because the driver\n    used AsyncSession.get(Spool) and SpoolService.record_consumption later read\n    spool.status. The driver must load through SpoolService.get_spool(), whose\n    query eagerly loads status/filament relationships.\n    """\n    driver = object.__new__(Driver)\n    sentinel_spool = object()\n    calls = []\n\n    class FakeSession:\n        async def __aenter__(self):\n            return self\n        async def __aexit__(self, *args):\n            return None\n        async def get(self, *args, **kwargs):\n            raise AssertionError("raw AsyncSession.get(Spool) must not be used")\n\n    class FakeSessionFactory:\n        def __call__(self):\n            return FakeSession()\n\n    class FakeService:\n        def __init__(self, db):\n            self.db = db\n        async def get_spool(self, spool_id):\n            calls.append(("get", spool_id))\n            return sentinel_spool\n        async def record_consumption(self, **kwargs):\n            calls.append(("record", kwargs))\n            return object(), 275.0\n\n    import app.plugins.bambuddy.driver as driver_module\n    monkeypatch.setattr(driver_module, "async_session_maker", FakeSessionFactory())\n    monkeypatch.setattr(driver_module, "SpoolService", FakeService)\n\n    await driver._report_consumption_db(\n        5, 5.0, source_event_key="run-physical:5:0:1"\n    )\n\n    assert calls[0] == ("get", 5)\n    assert calls[1][0] == "record"\n    assert calls[1][1]["spool"] is sentinel_spool\n    assert calls[1][1]["source_event_key"] == "run-physical:5:0:1"\n\n\n@pytest.mark.asyncio\nasync def test_report_consumption_retries_with_same_idempotency_key(monkeypatch):\n    driver = object.__new__(Driver)\n    attempts = []\n\n    async def flaky(spool_id, grams, *, source_event_key=None):\n        attempts.append((spool_id, grams, source_event_key))\n        if len(attempts) < 3:\n            raise RuntimeError("temporary write failure")\n\n    driver._report_consumption_db = flaky\n    monkeypatch.setattr("app.plugins.bambuddy.driver.asyncio.sleep", _no_sleep)\n\n    await driver._report_consumption(\n        5, 5.0, source_event_key="stable-run:17:0:1"\n    )\n\n    assert attempts == [\n        (5, 5.0, "stable-run:17:0:1"),\n        (5, 5.0, "stable-run:17:0:1"),\n        (5, 5.0, "stable-run:17:0:1"),\n    ]\n\n\nasync def _no_sleep(_delay):\n    return None\n'''
              test.write_text(ts)
          PY
          git diff --check
          python -m compileall -q bambuddy
      - name: Commit hotfix to PR branch
        run: |
          if git diff --quiet; then
            echo 'Hotfix already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bambuddy/driver.py bambuddy/plugin.json tests/test_consumption_protocol.py
          git commit -m 'fix: eager-load spool before consumption write'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
