name: Plugin 1.3.7 Release Gate

on:
  pull_request:
    branches: [feat/bambuddy-inventory-only]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
      - name: Checkout FilaMan runtime
        uses: actions/checkout@v4
        with:
          repository: MikeFox303/filaman-system
          ref: 3e8778283d1a719307c1b4ae487ed755cc2cc413
          path: filaman-system
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FilaMan runtime dependencies
        working-directory: filaman-system/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --extra dev
      - name: Install plugin into FilaMan runtime
        run: |
          mkdir -p filaman-system/backend/app/plugins/bambuddy
          cp -a bambuddy/. filaman-system/backend/app/plugins/bambuddy/
      - name: Verify version
        run: python -c "import json; d=json.load(open('bambuddy/plugin.json')); assert d['version']=='1.3.7'; print(d['version'])"
      - name: Run full plugin suite
        working-directory: filaman-system/backend
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/bambuddy:${{ github.workspace }}/filaman-system/backend
        run: uv run pytest "$GITHUB_WORKSPACE/tests" -q
