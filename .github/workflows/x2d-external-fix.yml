name: X2D external tray normalization

on:
  push:
    branches: [fix/x2d-external-trays]
  pull_request:
    branches: [feat/bambuddy-inventory-only]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/x2d-external-trays
          fetch-depth: 0

      - name: Patch driver to use canonical external assignment ids
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bambuddy/driver.py')
          text = path.read_text()
          import_anchor = 'from .profile_variants import ('
          if import_anchor not in text:
              raise SystemExit('driver import anchor not found')
          if 'from .external_slots import canonical_external_tray_id, external_slot_index' not in text:
              text = text.replace(
                  import_anchor,
                  'from .external_slots import canonical_external_tray_id, external_slot_index\n\n' + import_anchor,
                  1,
              )

          old_idx = '            vt_idx = f"255-{vt_id}"'
          if text.count(old_idx) != 1:
              raise SystemExit(f'expected 1 external slot-index anchor, found {text.count(old_idx)}')
          text = text.replace(
              old_idx,
              '            vt_tray_id = canonical_external_tray_id(vt_id)\n'
              '            vt_idx = external_slot_index(vt_id)',
              1,
          )

          old_call = '255, vt_id'
          if text.count(old_call) != 4:
              raise SystemExit(f'expected 4 external assignment calls, found {text.count(old_call)}')
          text = text.replace(old_call, '255, vt_tray_id')
          path.write_text(text)
          PY

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run focused pure tests
        run: pytest -q tests/test_external_slots.py

      - name: Commit validated product change and remove temporary workflow
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/x2d-external-fix.yml
          git add bambuddy/driver.py bambuddy/external_slots.py tests/test_external_slots.py
          git commit -m "fix: normalize X2D external tray assignments"
          git push origin HEAD:fix/x2d-external-trays
