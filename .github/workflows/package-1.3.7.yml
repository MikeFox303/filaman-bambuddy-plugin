name: Package Bambuddy Plugin 1.3.7

on:
  push:
    branches: [ci/validate-plugin-1.3.7]
    paths:
      - ".github/workflows/package-1.3.7.yml"
  pull_request:
    branches: [feat/bambuddy-inventory-only]
    paths:
      - ".github/workflows/package-1.3.7.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 88f19f100dda3559ae753dfe1ba9d741a2185a46
      - name: Verify manifest version
        run: |
          python - <<'PY'
          import json
          data = json.load(open('bambuddy/plugin.json', encoding='utf-8'))
          assert data['plugin_key'] == 'bambuddy'
          assert data['version'] == '1.3.7'
          print('manifest OK:', data['plugin_key'], data['version'])
          PY
      - name: Build installable ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('bambuddy')
          out = Path('bambuddy-1.3.7.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts and path.suffix != '.pyc':
                      zf.write(path, path.as_posix())
          print(out, out.stat().st_size)
          PY
          sha256sum bambuddy-1.3.7.zip | tee bambuddy-1.3.7.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bambuddy-1.3.7
          path: |
            bambuddy-1.3.7.zip
            bambuddy-1.3.7.sha256
          if-no-files-found: error
          retention-days: 30
